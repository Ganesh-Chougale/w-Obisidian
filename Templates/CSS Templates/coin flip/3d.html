<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Flip – External SVG</title>

<style>
    body {
        height: 100vh;
        margin: 0;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        position: relative;
    }

    .coin {
        width: 120px;
        height: 120px;
        position: relative;
        transform-style: preserve-3d;
        cursor: pointer;
    }

    .side {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        backface-visibility: hidden;
        box-shadow:
            inset 0 0 40px rgba(255,255,255,.35),
            0 12px 20px -10px rgba(0,0,0,.4);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .heads {
        background: radial-gradient(circle at 30% 30%, #7a7a7a, #2b2b2b);
    }

    .tails {
        background: radial-gradient(circle at 30% 30%, #7a7a7a, #2b2b2b);
        transform: rotateY(180deg);
    }

    /* SVG sizing */
    .side object {
        width: 70%;
        height: 70%;
        pointer-events: none;
        opacity: 0.9;
    }

    .flip-heads {
        animation: headsFlip 1.8s ease-out forwards;
    }

    .flip-tails {
        animation: tailsFlip 1.8s ease-out forwards;
    }

    @keyframes headsFlip {
        to { transform: rotateY(1800deg); }
    }

    @keyframes tailsFlip {
        to { transform: rotateY(1980deg); }
    }

    /* Cooldown overlay */
    .overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(0,0,0,0.45);
        backdrop-filter: blur(3px);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .3s;
    }

    .overlay.active {
        opacity: 1;
    }
</style>
</head>

<body>

<div class="container">
    <div id="coin" class="coin">

        <!-- HEADS -->
        <div class="side heads">
            <object type="image/svg+xml" data="./Svgs/Head_Prime.svg"></object>
        </div>

        <!-- TAILS -->
        <div class="side tails">
            <object type="image/svg+xml" data="./Svgs/Tail_Prime.svg"></object>
        </div>

    </div>

    <div id="overlay" class="overlay"></div>
</div>

<script>
    const coin = document.getElementById('coin');
    const overlay = document.getElementById('overlay');

    const FLIP_DURATION = 1800;
    const COOLDOWN_SECONDS = 30;

    let locked = false;

    coin.addEventListener('click', () => {
        if (locked) return;

        locked = true;
        coin.classList.remove('flip-heads', 'flip-tails');

        const isHeads = Math.random() < 0.5;

        // restart animation cleanly
        void coin.offsetWidth;
        coin.classList.add(isHeads ? 'flip-heads' : 'flip-tails');

        setTimeout(startCooldown, FLIP_DURATION);
    });

    function startCooldown() {
        let remaining = COOLDOWN_SECONDS;
        overlay.classList.add('active');
        overlay.textContent = `wait ${remaining}s`;

        const timer = setInterval(() => {
            remaining--;
            overlay.textContent = `wait ${remaining}s`;

            if (remaining <= 0) {
                clearInterval(timer);
                overlay.classList.remove('active');
                locked = false;
            }
        }, 1000);
    }
</script>

</body>
</html>
