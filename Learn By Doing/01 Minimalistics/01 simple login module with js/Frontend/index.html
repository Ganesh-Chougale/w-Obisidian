<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login module using simple JS</title>
</head>
<body>

    <!--  -->
    <div id="universalArea">
        <button type="button" id="uRegister">Register</button>
        <button type="button" id="uLogin">Login</button>

    </div>
    <!--  -->
    <div id="registerArea" style="display: none;">

        <label for="rFullName">Full Name</label>
        <input type="text" name="rFullName" id="rFullName">
        <br>


        <label for="rEmail">Email</label>
        <input type="email" name="rEmail" id="rEmail">
        <br>

        <label for="rPassword">Password</label>
        <input type="password" name="rPassword" id="rPassword">
        <br>

        <label for="rConfirmPassword">Confirm Password</label>
        <input type="password" name="rConfirmPassword" id="rConfirmPassword">     
        <br>
        
        <button type="button" id="regTest">Test</button>

    </div>
    <!--  -->
    <div id="loginArea" style="display: none;">

        <label for="lEmail">Email</label>
        <input type="email" name="lEmail" id="lEmail">
        <br>

        <label for="lPassword">Password</label>
        <input type="password" name="lPassword" id="lPassword">
        <br>
        
        <button type="button" id="loginTest">Test</button>

    </div>    
    <!--  -->


<script src="./Main.js"></script>
</body>
</html>
