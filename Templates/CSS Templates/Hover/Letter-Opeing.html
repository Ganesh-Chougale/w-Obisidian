<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Open Letter</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --primary-color: #e95f55;
      --primary-dark: color-mix(in srgb, var(--primary-color), black 15%);
      --primary-light: color-mix(in srgb, var(--primary-color), black 5%);
      --bg-color: #323641;
      --letter-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    body {
      background: var(--bg-color);
    }

    .letter-image {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }

    .animated-mail {
      position: absolute;
      height: 150px;
      width: 200px;
      transition: .4s;
    }

    .animated-mail .body {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 100px 200px;
      border-color: transparent transparent var(--primary-color) transparent;
      z-index: 2;
    }

    .animated-mail .top-fold {
      position: absolute;
      top: 50px;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 50px 100px 0 100px;
      transform-origin: 50% 0%;
      transition: transform .4s .4s, z-index .2s .4s;
      border-color: var(--primary-dark) transparent transparent transparent;
      z-index: 2;
    }

    .animated-mail .back-fold {
      position: absolute;
      bottom: 0;
      width: 200px;
      height: 100px;
      background: var(--primary-dark);
      z-index: 0;
    }

    .animated-mail .left-fold {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 50px 0 50px 100px;
      border-color: transparent transparent transparent var(--primary-light);
      z-index: 2;
    }

    .animated-mail .letter {
      left: 20px;
      bottom: 0px;
      position: absolute;
      width: 160px;
      height: 60px;
      background: var(--letter-bg);
      z-index: 1;
      overflow: hidden;
      transition: .4s .2s;
    }

    .animated-mail .letter .letter-border {
      height: 10px;
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        var(--primary-light),
        var(--primary-light) 8px,
        transparent 8px,
        transparent 18px
      );
    }

    .animated-mail .letter .letter-title {
      margin-top: 10px;
      margin-left: 5px;
      height: 10px;
      width: 40%;
      background: var(--primary-light);
    }

    .animated-mail .letter .letter-context {
      margin-top: 10px;
      margin-left: 5px;
      height: 10px;
      width: 20%;
      background: var(--primary-light);
    }

    .animated-mail .letter .letter-stamp {
      margin-top: 30px;
      margin-left: 120px;
      border-radius: 100%;
      height: 30px;
      width: 30px;
      background: var(--primary-light);
      opacity: 0.3;
    }

    .shadow {
      position: absolute;
      top: 200px;
      left: 50%;
      width: 400px;
      height: 30px;
      transition: .4s;
      transform: translateX(-50%);
      border-radius: 100%;
      background: radial-gradient(var(--shadow-color), rgba(0,0,0,0.0), rgba(0,0,0,0.0));
    }

    .letter-image:hover .animated-mail {
      transform: translateY(50px);
    }

    .letter-image:hover .animated-mail .top-fold {
      transition: transform .4s, z-index .2s;
      transform: rotateX(180deg);
      z-index: 0;
    }

    .letter-image:hover .animated-mail .letter {
      height: 180px;
    }

    .letter-image:hover .shadow {
      width: 250px;
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
 <div class="letter-image">
	<div class="animated-mail">
		<div class="back-fold"></div>
		<div class="letter">
			<div class="letter-border"></div>
			<div class="letter-title"></div>
			<div class="letter-context"></div>
			<div class="letter-stamp">
				<div class="letter-stamp-inner"></div>
			</div>
		</div>
		<div class="top-fold"></div>
		<div class="body"></div>
		<div class="left-fold"></div>
	</div>
	<div class="shadow"></div>
</div>
<!-- HTML -->


</body>
</html>
