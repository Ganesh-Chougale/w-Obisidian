<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Liquid Measure Button</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --primary-hue: 210;
      --bg-color: #141218;
      
      /* Dynamic Color Variables */
      --btn-color: hsl(var(--primary-hue), 80%, 42%);
      --text-color: hsla(var(--primary-hue), 50%, 85%, 1);
      
      /* Auto shade calculations */
      --shadow-color: hsla(var(--primary-hue), 40%, 52%, .4);
      --focus-shadow: hsla(var(--primary-hue), 80%, 42%, .6);
    }

    /* Override body background to match template theme */
    html { background-color: var(--bg-color); }
    body { background-color: var(--bg-color); }

    button {
      position: relative;
      padding: 10px 20px;  
      border: none;
      background: none;
      cursor: pointer;
      font-family: "Source Code Pro", monospace;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 30px;  
      color: var(--text-color);
      background-color: var(--btn-color);
      box-shadow: var(--shadow-color) 2px 2px 22px;
      border-radius: 4px; 
      z-index: 0;  
      overflow: hidden;   
    }

    button:focus {
      outline: none;
      box-shadow: var(--focus-shadow) 2px 2px 22px;
    }

    /* Content layers for glitch effect */
    .right::after, 
    button::after {
      content: var(--content);
      display: block;
      position: absolute;
      white-space: nowrap;
      padding: 40px 40px;
      pointer-events: none;
    }

    button::after {
      font-weight: 200;
      top: -30px;
      left: -20px;
    } 

    .right, .left {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
    }
    
    .right { left: 66%; }
    .left { right: 66%; }

    .right::after {
      top: -30px;
      left: calc(-66% - 20px);
      background-color: var(--bg-color);
      color: transparent;
      transition: transform .4s ease-out;
      transform: translate(0, -90%) rotate(0deg);
    }

    button:hover .right::after {
      transform: translate(0, -47%) rotate(0deg);
    }

    button .right:hover::after {
      transform: translate(0, -50%) rotate(-7deg);
    }

    button .left:hover ~ .right::after {
      transform: translate(0, -50%) rotate(7deg);
    }

    /* Bubbles/Liquid Animation */
    button::before {
      content: '';
      pointer-events: none;
      opacity: .6;
      background:
        radial-gradient(circle at 20% 35%, transparent 0, transparent 2px, var(--text-color) 3px, var(--text-color) 4px, transparent 4px),
        radial-gradient(circle at 75% 44%, transparent 0, transparent 2px, var(--text-color) 3px, var(--text-color) 4px, transparent 4px),
        radial-gradient(circle at 46% 52%, transparent 0, transparent 4px, var(--text-color) 5px, var(--text-color) 6px, transparent 6px);
      width: 100%;
      height: 300%;
      top: 0;
      left: 0;
      position: absolute;
      animation: bubbles 5s linear infinite both;
    }

    @keyframes bubbles {
      from { transform: translateY(0); }
      to { transform: translateY(-66.666%); }
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
<button style="--content: 'Hover me!';">
  <div class="left"></div>
    Hover me!
  <div class="right"></div>
</button>
<!-- HTML -->


</body>
</html>
