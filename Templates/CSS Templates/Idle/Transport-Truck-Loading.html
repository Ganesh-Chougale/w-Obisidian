<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Transport Truck Loading</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --primary-teal: #009688;
      /* Auto shade calculation: lighten(#009688, 15%) */
      --light-teal: #4DB6AC;
      --white: #ffffff;
      --off-white: #eeeeee;
      --rock-grey: #dddddd;
    }

    body {
      background: var(--primary-teal);
      overflow: hidden;
    }

    .loop-wrapper {
      margin: 0 auto;
      position: relative;
      display: block;
      width: 600px;
      height: 250px;
      overflow: hidden;
      border-bottom: 3px solid var(--white);
      color: var(--white);
    }

    .mountain {
      position: absolute;
      right: -900px;
      bottom: -20px;
      width: 2px;
      height: 2px;
      box-shadow: 
        0 0 0 50px var(--light-teal),
        60px 50px 0 70px var(--light-teal),
        90px 90px 0 50px var(--light-teal),
        250px 250px 0 50px var(--light-teal),
        290px 320px 0 50px var(--light-teal),
        320px 400px 0 50px var(--light-teal);
      transform: rotate(130deg);
      animation: mtn 20s linear infinite;
    }

    .hill {
      position: absolute;
      right: -900px;
      bottom: -50px;
      width: 400px;
      border-radius: 50%;
      height: 20px;
      box-shadow: 
        0 0 0 50px var(--light-teal),
        -20px 0 0 20px var(--light-teal),
        -90px 0 0 50px var(--light-teal),
        250px 0 0 50px var(--light-teal),
        290px 0 0 50px var(--light-teal),
        620px 0 0 50px var(--light-teal);
      animation: hill 4s 2s linear infinite;
    }

    .tree {
      position: absolute;
      height: 100px; 
      width: 35px;
      bottom: 0;
      background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/130015/tree.svg) no-repeat;
    }

    .rock {
      margin-top: -17%;
      height: 2%; 
      width: 2%;
      bottom: -2px;
      border-radius: 20px;
      position: absolute;
      background: var(--rock-grey);
    }

    .truck, .wheels {
      transition: all ease;
      width: 85px;
      margin-right: -60px;
      bottom: 0px;
      right: 50%;
      position: absolute;
    }

    .truck {
      background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/130015/truck.svg) no-repeat;
      background-size: contain;
      height: 60px;
    }

    .truck:before {
      content: " ";
      position: absolute;
      width: 25px;
      box-shadow:
        -30px 28px 0 1.5px var(--white),
        -35px 18px 0 1.5px var(--white);
    }

    .wheels {
      background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/130015/wheels.svg) no-repeat;
      height: 15px;
      margin-bottom: 0;
    }

    .tree:nth-child(3) { animation: tree 3s 0.000s linear infinite; }
    .tree:nth-child(4) { animation: tree2 2s 0.150s linear infinite; }
    .tree:nth-child(5) { animation: tree3 8s 0.050s linear infinite; }
    .rock { animation: rock 4s -0.530s linear infinite; }
    .truck { animation: truck 4s 0.080s ease infinite; }
    .wheels { animation: truck 4s 0.001s ease infinite; }
    .truck:before { animation: wind 1.5s 0.000s ease infinite; }

    @keyframes tree {
      0% { transform: translate(1350px); }
      100% { transform: translate(-50px); }
    }
    @keyframes tree2 {
      0% { transform: translate(650px); }
      100% { transform: translate(-50px); }
    }
    @keyframes tree3 {
      0% { transform: translate(2750px); }
      100% { transform: translate(-50px); }
    }
    @keyframes rock {
      0% { right: -200px; }
      100% { right: 2000px; }
    }
    @keyframes truck {
      0%, 100% { transform: translateY(0px); }
      6% { transform: translateY(0px); }
      7% { transform: translateY(-6px); }
      9% { transform: translateY(0px); }
      10% { transform: translateY(-1px); }
      11% { transform: translateY(0px); }
    }
    @keyframes wind {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
    }
    @keyframes mtn {
      100% { transform: translateX(-2000px) rotate(130deg); }
    }
    @keyframes hill {
      100% { transform: translateX(-2000px); }
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
 <div class="loop-wrapper">
  <div class="mountain"></div>
  <div class="hill"></div>
  <div class="tree"></div>
  <div class="tree"></div>
  <div class="tree"></div>
  <div class="rock"></div>
  <div class="truck"></div>
  <div class="wheels"></div>
</div> 
<!-- HTML -->


</body>
</html>
