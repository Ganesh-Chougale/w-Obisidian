<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Piston Button Transition</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --primary-color: #333333;
      --accent-color: #ffffff;
      
      /* Auto shade calculation for hover effects */
      --bg-hover: var(--accent-color);
      --text-hover: var(--primary-color);
      --icon-bg: #262626; /* Slightly darker shade for the icon box */
    }

    .wrapper {
      position: relative;
    }

    .link_wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    a {
      display: block;
      width: 250px;
      height: 50px;
      line-height: 50px;
      font-weight: bold;
      text-decoration: none;
      background: var(--primary-color);
      text-align: center;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 3px solid var(--primary-color);
      transition: all .35s;
      z-index: 2;
      position: relative;
    }

    .icon {
      width: 50px;
      height: 50px;
      border: 3px solid var(--primary-color);
      position: absolute;
      right: 0;
      top: 0;
      z-index: 1;
      background: var(--icon-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all .35s;
    }

    .icon svg {
      width: 20px;
      fill: var(--accent-color);
      transition: all .35s;
    }

    /* Hover Effects */
    a:hover {
      width: 200px;
      border: 3px solid var(--primary-color);
      background: transparent;
      color: var(--text-hover);
    }

    a:hover + .icon {
      right: -56px; /* Offset to account for border/spacing */
      background: var(--primary-color);
    }

    a:hover + .icon svg {
      fill: var(--accent-color);
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
<div class="wrapper">
  <div class="link_wrapper">
    <a href="#">Hover Me!</a>
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268.832 268.832">
        <path d="M265.17 125.577l-80-80c-4.88-4.88-12.796-4.88-17.677 0-4.882 4.882-4.882 12.796 0 17.678l58.66 58.66H12.5c-6.903 0-12.5 5.598-12.5 12.5 0 6.903 5.597 12.5 12.5 12.5h213.654l-58.66 58.662c-4.88 4.882-4.88 12.796 0 17.678 2.44 2.44 5.64 3.66 8.84 3.66s6.398-1.22 8.84-3.66l79.997-80c4.883-4.882 4.883-12.796 0-17.678z"/>
      </svg>
    </div>
  </div>
</div>
<!-- HTML -->


</body>
</html>
