<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Origami Dropdown Menu</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --menu-width: 150px;
      --menu-width-half: 75px;
      
      /* Base Colors */
      --color-green: #9dc852;
      --color-blue: #4e96b3;
      --color-red: #c97676;
      --color-yellow: #dbab58;
      
      /* Auto shade calculations (Hover states) */
      --color-green-dark: color-mix(in srgb, var(--color-green), black 10%);
      --color-blue-dark: color-mix(in srgb, var(--color-blue), black 10%);
      --color-red-dark: color-mix(in srgb, var(--color-red), black 10%);
      --color-yellow-dark: color-mix(in srgb, var(--color-yellow), black 10%);
      
      --dropdown-bg: #ebebeb;
      --dropdown-bg-closed: #dddddd;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .hList {
      display: flex;
    }

    .menu {
      display: block;
      position: relative;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

    .menu-title {
      display: block;
      width: var(--menu-width);
      height: 40px;
      padding: 12px 0 0;
      margin: 0;
      background: var(--color-green);
      text-align: center;
      color: var(--white);
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      transition: 0.3s background-color;
    }

    .menu-title:before {
      content: "";
      display: block;
      height: 0;
      border-top: 5px solid var(--color-green);
      border-left: var(--menu-width-half) solid transparent;
      border-right: var(--menu-width-half) solid transparent;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 101;
      transition: 0.2s 0.2s border-top ease-out, 0.3s border-top-color;
    }

    .menu-title:after {
      content: "";
      display: block;
      height: 0;
      border-left: var(--menu-width-half) solid transparent;
      border-right: var(--menu-width-half) solid transparent;
      border-bottom: 0 solid var(--dropdown-bg);
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 101;
      transition: 0.2s border-bottom ease-in;
    }

    .menu:hover > .menu-title:before {
      border-top-width: 0;
      transition: 0.2s border-top-width ease-in, 0.3s border-top-color;
    }

    .menu:hover > .menu-title:after {
      border-bottom-width: 5px;
      transition: 0.2s 0.2s border-bottom-width ease-out;
    }

    /* Color Variations */
    .menu-title:hover { background: var(--color-green-dark); }
    .menu-title:hover:before { border-top-color: var(--color-green-dark); }

    .menu-title_2nd { background: var(--color-blue); }
    .menu-title_2nd:before { border-top-color: var(--color-blue); }
    .menu-title_2nd:hover { background: var(--color-blue-dark); }
    .menu-title_2nd:hover:before { border-top-color: var(--color-blue-dark); }

    .menu-title_3rd { background: var(--color-red); }
    .menu-title_3rd:before { border-top-color: var(--color-red); }
    .menu-title_3rd:hover { background: var(--color-red-dark); }
    .menu-title_3rd:hover:before { border-top-color: var(--color-red-dark); }

    .menu-title_4th { background: var(--color-yellow); }
    .menu-title_4th:before { border-top-color: var(--color-yellow); }
    .menu-title_4th:hover { background: var(--color-yellow-dark); }
    .menu-title_4th:hover:before { border-top-color: var(--color-yellow-dark); }

    /* Dropdown Logic */
    .menu-dropdown {
      min-width: 100%;
      padding: 15px 0;
      position: absolute;
      background: var(--dropdown-bg);
      z-index: 100;
      transition: 0.5s padding, 0.5s background;
    }

    .menu-dropdown:after {
      content: "";
      display: block;
      height: 0;
      border-top: 5px solid var(--dropdown-bg);
      border-left: var(--menu-width-half) solid transparent;
      border-right: var(--menu-width-half) solid transparent;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 101;
      transition: 0.5s border-top;
    }

    .menu:not(:hover) > .menu-dropdown {
      padding: 4px 0;
      background: var(--dropdown-bg-closed);
      z-index: 99;
    }

    .menu:not(:hover) > .menu-dropdown:after {
      border-top-color: var(--dropdown-bg-closed);
    }

    .menu:not(:hover) > .menu-title:after {
      border-bottom-color: var(--dropdown-bg-closed);
    }

    .menu-dropdown > li {
      overflow: hidden;
      height: 30px;
      padding: 5px 10px;
      background: rgba(0,0,0,0);
      white-space: nowrap;
      transition: 
        0.5s height cubic-bezier(.73,.32,.34,1.5),
        0.5s padding cubic-bezier(.73,.32,.34,1.5),
        0.5s margin cubic-bezier(.73,.32,.34,1.5),
        0.5s 0.2s color,
        0.2s background-color;
    }

    .menu-dropdown > li:hover {
      background: rgba(0,0,0,0.1);
    }

    .menu:not(:hover) > .menu-dropdown > li {
      visibility: hidden;
      height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
      color: rgba(25,25,25,0);
      transition: 0.5s 0.1s height, 0.5s 0.1s padding, 0.5s 0.1s margin, 0.3s color, 0.6s visibility;
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
<ul class="hList">
  <li>
    <a href="#" class="menu">
      <h2 class="menu-title">animals</h2>
      <ul class="menu-dropdown">
        <li>cat</li>
        <li>dog</li>
        <li>horse</li>
        <li>cow</li>
        <li>pig</li>
      </ul>
    </a>
  </li>
  <li>
    <a href="#" class="menu">
      <h2 class="menu-title menu-title_2nd">names</h2>
      <ul class="menu-dropdown">
        <li>Kevin</li>
        <li>Jim</li>
        <li>Andy</li>
      </ul>
    </a>
  </li>
  <li>
    <a href="#" class="menu">
      <h2 class="menu-title menu-title_3rd">things</h2>
      <ul class="menu-dropdown">
        <li>bench</li>
        <li>pizza</li>
        <li>Honda CB125</li>
        <li>space</li>
        <li>apple</li>
      </ul>
    </a>
  </li>
  <li>
    <a href="#" class="menu">
      <h2 class="menu-title menu-title_4th">Movies</h2>
      <ul class="menu-dropdown">
        <li>Godzilla</li>
        <li>Man on Wire</li>
        <li>Interstellar</li>
      </ul>
    </a>
  </li>
</ul>

</body>
</html>```
