<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Slide-Fill-Button</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /*  */
  .button {
    /* Set your color variable here */
    --color: #ff7300; 
    
    display: inline-block;
    padding: .75rem 1.25rem;
    border-radius: 10rem;
    color: #fff;
    text-transform: uppercase;
    font-size: 1rem;
    letter-spacing: .15rem;
    transition: all .3s;
    position: relative;
    overflow: hidden;
    z-index: 1;

    &::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 100%;
      background-color: var(--color);
      border-radius: 10rem;
      z-index: -2;
    }

    &::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0%; height: 100%;
      /* Replaces darken($color, 15%) using native CSS color-mix */
      background-color: color-mix(in srgb, var(--color), black 15%);
      transition: all .3s;
      border-radius: 10rem;
      z-index: -1;
    }

    &:hover {
      color: #fff;
      &::before { width: 100%; }
    }
  }

  /* Optional Presentation Styles */
  .container { width: 100%; text-align: center; }
  h1 { text-transform: uppercase; font-size: .8rem; color: #777; }
  span { display: block; margin-top: 2rem; font-size: .7rem; color: #777; }
  span a { color: #999; text-decoration: underline; }
</style>

    /*  */
</head>

<body>

<div class="container">
  <a href="#" class="button">Hover me</a>
</div>

</body>
</html>
