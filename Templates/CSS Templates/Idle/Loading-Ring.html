<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Neon Loading Ring</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --bg-color: #262626;
      --ring-border: #3c3c3c;
      --neon-yellow: #fff000;
      /* Auto shade calculation: rgba(255, 240, 0, 0.5) */
      --glow-color: color-mix(in srgb, var(--neon-yellow), transparent 50%);
    }

    body {
      background: var(--bg-color);
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      background: transparent;
      border: 3px solid var(--ring-border);
      border-radius: 50%;
      text-align: center;
      line-height: 150px;
      font-family: sans-serif;
      font-size: 20px;
      color: var(--neon-yellow);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--neon-yellow);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .ring:before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top: 3px solid var(--neon-yellow);
      border-right: 3px solid var(--neon-yellow);
      border-radius: 50%;
      animation: animateC 2s linear infinite;
    }

    .ring span {
      display: block;
      position: absolute;
      top: calc(50% - 2px);
      left: 50%;
      width: 50%;
      height: 4px;
      background: transparent;
      transform-origin: left;
      animation: animate 2s linear infinite;
    }

    .ring span:before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--neon-yellow);
      top: -6px;
      right: -8px;
      box-shadow: 0 0 20px var(--neon-yellow);
    }

    @keyframes animateC {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes animate {
      0% { transform: rotate(45deg); }
      100% { transform: rotate(405deg); }
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
<div class="ring">Loading
  <span></span>
</div>
<!-- HTML -->


</body>
</html>
