<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Funny Candles Blow Fixed</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --bg-light: #ffffff;
      --bg-dark: #000000;
      --main-purple: #673C63;
      --candle-white: #ffffff;
      --candle-shadow: #95c6f2;
      --fire-orange: #FF9800;
      --smoke-grey: #808080;
      --angry-red: #F44336;
      --light-border: rgba(255, 255, 255, 0.2);
    }

    body {
      background-color: var(--bg-light);
      animation: change-background 3s infinite linear;
    }

    .wrapper {
      position: absolute;
      left: 50%;
      top: 70%;
      transform: scale(1.5, 1.5) translate(-50%, -50%);
    }

    .floor {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 350px;
      height: 5px;
      background: var(--main-purple);
      transform: translate(-50%, -50%);
      box-shadow: 0px 2px 5px #111;
      z-index: 2;
    }

    .candles {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 250px;
      height: 150px;
      transform: translate(-50%, -100%);
      z-index: 1;
    }

    .candle1 {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 35px;
      height: 100px;
      background: var(--candle-white);
      border: 3px solid var(--main-purple);
      border-bottom: 0px;
      border-radius: 3px;
      transform-origin: center right;
      transform: translate(60%, -25%);
      box-shadow: -2px 0px 0px var(--candle-shadow) inset;
      animation: expand-body 3s infinite linear;
    }

    .candle1__stick, .candle2__stick {
      position: absolute;
      left: 50%;
      top: 0%;
      width: 3px;
      height: 15px;
      background: var(--main-purple);
      border-radius: 8px;
      transform: translate(-50%, -100%);
    }

    .candle2__stick {
      height: 12px;
      transform-origin: bottom center;
      animation: stick-animation 3s infinite linear;
    }

    .candle2__fire {
      position: absolute;
      top: -15px; /* Adjusted to sit above the wick */
      left: 50%;
      display: block;
      width: 16px;
      height: 20px;
      background-color: var(--fire-orange);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transform: translate(-50%, -50%);
      animation: dance-fire 3s infinite linear;
    }

    .candle1__eyes, .candle2__eyes {
      position: absolute;
      left: 50%;
      top: 0%;
      width: 35px;
      height: 30px;
      transform: translate(-50%, 0%);
    }

    .candle1__eyes-one, .candle1__eyes-two {
      position: absolute;
      top: 20%;
      width: 5px;
      height: 5px;
      border-radius: 100%;
      background: var(--main-purple);
      animation: blink-eyes 3s infinite linear;
    }

    .candle1__eyes-one { left: 30%; transform: translate(-70%, 0%); }
    .candle1__eyes-two { left: 70%; transform: translate(-70%, 0%); }

    .candle1__mouth {
      position: absolute;
      left: 40%;
      top: 20%;
      width: 0px;
      height: 0px;
      border-radius: 20px;
      background: var(--main-purple);
      transform: translate(-50%, -50%);
      animation: uff 3s infinite linear;
    }

    .candle2 {
      position: absolute;
      left: 20%;
      top: 65%;
      width: 42px;
      height: 60px;
      background: var(--candle-white);
      border: 3px solid var(--main-purple);
      border-bottom: 0px;
      border-radius: 3px;
      transform: translate(60%, -15%);
      transform-origin: center right;
      box-shadow: -2px 0px 0px var(--candle-shadow) inset;
      animation: shake-left 3s infinite linear;
    }

    .candle2__eyes-one, .candle2__eyes-two {
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      background: var(--main-purple);
      border-radius: 100%;
      transform: translate(-80%, 0%);
    }

    .candle2__eyes-one { left: 30%; animation: changeto-lower 3s infinite linear; }
    .candle2__eyes-two { left: 70%; animation: changeto-greater 3s infinite linear; }

    /* Animations */
    @keyframes dance-fire {
      59%, 89% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
      0%, 7%, 15%, 23%, 31%, 39%, 47%, 55%, 90% { opacity: 1; transform: translate(-50%, -50%) scale(1); background: #FFC107; }
      3%, 11%, 19%, 27%, 35%, 43%, 51%, 58%, 94% { opacity: 1; transform: translate(-48%, -52%) scale(1.1); background: var(--fire-orange); }
    }

    @keyframes change-background {
      0%, 59%, 98%, 100% { background: var(--bg-light); }
      61%, 97% { background: var(--bg-dark); }
    }

    @keyframes expand-body {
      0%, 40% { transform: scale(1, 1) translate(60%, -25%); }
      45%, 55% { transform: scale(1.1, 1.1) translate(60%, -28%); }
      60% { transform: scale(0.89, 0.89) translate(60%, -25%); }
      65% { transform: scale(1, 1) translate(60%, -25%); }
    }

    @keyframes blink-eyes {
      0%, 35% { opacity: 1; transform: translate(-70%, 0%); }
      36%, 39% { opacity: 0; transform: translate(-70%, 0%); }
      40% { opacity: 1; transform: translate(-70%, 0%); }
      50%, 65% { transform: translate(-140%, 0%); }
      66% { transform: translate(-70%, 0%); }
    }

    @keyframes stick-animation {
      0%, 40%, 50%, 54%, 59%, 74%, 84%, 92% { transform: translate(-50%, -100%) rotateZ(0deg); }
      62% { transform: rotateZ(-15deg) translate(-50%, -100%); }
      65% { transform: rotateZ(15deg) translate(-50%, -100%); }
      85% { transform: rotateZ(180deg) translate(0%, 120%); }
    }
    
    @keyframes shake-left {
      0%, 40%, 50%, 54%, 59%, 67% { left: 20%; transform: translate(60%, -15%); }
      62% { left: 18%; }
      65% { left: 21%; }
      75% { transform: scale(1.15, 0.85) translate(60%, -15%); background: var(--candle-white); }
      91% { transform: scale(1.18, 0.82) translate(60%, -10%); background: var(--angry-red); }
      97% { transform: scale(1, 1) translate(60%, -15%); }
    }

    @keyframes uff {
      0%, 40% { width: 0px; height: 0px; }
      50%, 54% { width: 15px; height: 15px; left: 30%; }
      67% { width: 0px; height: 0px; }
    }

    @keyframes changeto-lower { 0%, 70%, 90% { background: var(--main-purple); } }
    @keyframes changeto-greater { 0%, 70%, 90% { background: var(--main-purple); } }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
<div class="wrapper">
  <div class="candles">
    <div class="candle1">
      <div class="candle1__stick"></div>
      <div class="candle1__eyes">
        <span class="candle1__eyes-one"></span>
        <span class="candle1__eyes-two"></span>
      </div>
      <div class="candle1__mouth"></div>
    </div>
    <div class="candle2">
      <div class="candle2__stick"></div>
      <div class="candle2__fire"></div>
      <div class="candle2__eyes">
        <span class="candle2__eyes-one"></span>
        <span class="candle2__eyes-two"></span>
      </div>
    </div>
  </div>
  <div class="floor"></div>
</div>
<!-- HTML -->


</body>
</html>
