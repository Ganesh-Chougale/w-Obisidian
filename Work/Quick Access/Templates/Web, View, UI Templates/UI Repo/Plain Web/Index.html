<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Snippet Preview</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="panel code-panel">
            <div class="panel-header">
                <h2>Code Editor</h2>
            </div>

            <div class="panel-content">
                <textarea id="codeEditor" spellcheck="false"><button>Hello</button></textarea>
            </div>
        </section>


        <section class="panel preview-panel">
            <div class="panel-header">
                <h2>Live Preview</h2>
                <span id="libraryName">Library: None</span>
            </div>

            <div class="panel-content preview-content" id="preview">
                <button>Hello</button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
