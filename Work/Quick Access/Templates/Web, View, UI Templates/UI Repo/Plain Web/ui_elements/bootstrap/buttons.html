<!-- ========================================================= -->
<!-- BOOTSTRAP ELEMENTS -->
<!-- ========================================================= -->

<div id="bootstrapElements" class="mt-5 d-none">
  <h2 class="h4 mb-4">Bootstrap Elements</h2>

  <!-- Buttons Section -->
  <section>
    <h3 class="h5 mb-3">Buttons</h3>

    <!-- Button 1 -->
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h4 class="h6">Primary Button</h4>

        <div class="row g-3 align-items-stretch">
          <!-- Preview -->
          <div class="col-12 col-md-6">
            <div class="element-preview h-100">
              <button class="btn btn-primary">Primary Button</button>
            </div>
          </div>

          <!-- Code -->
          <div class="col-12 col-md-6">
            <div class="code-container h-100">
              <button
                class="btn btn-sm btn-outline-secondary copy-button"
                onclick="copyCode(this)"
              >
                <i class="fa-regular fa-copy"></i>
                Copy
              </button>

              <pre class="bg-dark text-light p-3 rounded h-100" >
                <code>&lt;button class="btn btn-primary"&gt;Primary Button&lt;/button&gt;</code>
            </pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Button 2 -->
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h4 class="h6">Secondary Button</h4>

        <div class="row g-3 align-items-stretch">
          <!-- Preview -->
          <div class="col-12 col-md-6">
            <div class="element-preview h-100">
              <button class="btn btn-secondary">Secondary Button</button>
            </div>
          </div>

          <!-- Code -->
          <div class="col-12 col-md-6">
            <div class="code-container h-100">
              <button
                class="btn btn-sm btn-outline-secondary copy-button"
                onclick="copyCode(this)"
              >
                <i class="fa-regular fa-copy"></i>
                Copy
              </button>

              <pre
                class="bg-dark text-light p-3 rounded h-100"
              ><code>&lt;button class="btn btn-secondary"&gt;
    Secondary Button
&lt;/button&gt;</code></pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Button 3 -->
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h4 class="h6">Outline Button</h4>

        <div class="row g-3 align-items-stretch">
          <!-- Preview -->
          <div class="col-12 col-md-6">
            <div class="element-preview h-100">
              <button class="btn btn-outline-primary">Outline Button</button>
            </div>
          </div>

          <!-- Code -->
          <div class="col-12 col-md-6">
            <div class="code-container h-100">
              <button
                class="btn btn-sm btn-outline-secondary copy-button"
                onclick="copyCode(this)"
              >
                <i class="fa-regular fa-copy"></i>
                Copy
              </button>

              <pre
                class="bg-dark text-light p-3 rounded h-100"
              ><code>&lt;button class="btn btn-outline-primary"&gt;
    Outline Button
&lt;/button&gt;</code></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
