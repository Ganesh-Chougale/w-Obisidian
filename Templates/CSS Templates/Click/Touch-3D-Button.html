<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Touch-3D-Button</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /*  */
    :root {
      --btn-base: #00d9ff;

      --btn-bg: var(--btn-base);
      --btn-bg-active: oklch(from var(--btn-base) calc(l - 0.05) c h);
      --btn-shadow:    oklch(from var(--btn-base) calc(l - 0.25) c h);
      --btn-highlight: oklch(from var(--btn-base) calc(l + 0.15) c h);
      --btn-floor:     oklch(from var(--btn-base) calc(l - 0.45) c h);
      --btn-text-shadow: rgba(0, 0, 0, 0.4);
    }

    .button {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    .button a {
      color: white;
      font-family: Helvetica, sans-serif;
      font-weight: bold;
      font-size: 36px;
      text-align: center;
      text-decoration: none;
      background-color: var(--btn-bg);
      display: block;
      position: relative;
      padding: 20px 40px;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      text-shadow: 0px 1px 0px var(--btn-text-shadow);
      box-shadow: inset 0 1px 0 var(--btn-highlight), 0 10px 0 var(--btn-shadow);
      border-radius: 5px;
      transition: top 0.1s, background-color 0.1s;
    }

    .button a:active {
      top: 10px;
      background-color: var(--btn-bg-active);
      box-shadow: inset 0 1px 0 var(--btn-highlight), inset 0 -3px 0 var(--btn-shadow);
    }

    .button:after {
      content: "";
      height: 100%;
      width: 100%;
      padding: 4px;
      position: absolute;
      bottom: -15px;
      left: -4px;
      z-index: -1;
      background-color: var(--btn-floor);
      border-radius: 5px;
    }
    /*  */


  </style>
</head>

<body>

<div ontouchstart="">
  <div class="button">
    <a href="#">3D Button</a>
  </div>
</div>

</body>
</html>
