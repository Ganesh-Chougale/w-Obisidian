<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Password Reveal</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --bg-main: #000000;
      --bg-panel: #0f0f0f;
      --text-white: #ffffff;
      --grid-line: rgba(242, 242, 242, 0.25);
      
      /* Auto shade calculations based on sin waves for the glide effect */
      --lerp-0: 1;
      --lerp-1: 0.766; /* sin(50deg) */
      --lerp-2: 0.707; /* sin(45deg) */
      --lerp-3: 0.573; /* sin(35deg) */
      --lerp-4: 0.422; /* sin(25deg) */
      --lerp-5: 0.258; /* sin(15deg) */
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg-main);
      overflow: hidden;
    }

    body::before {
      content: "";
      height: 100vh;
      width: 100vw;
      position: fixed;
      background:
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px 10vmin) 0 -5vmin / 10vmin 10vmin,
        linear-gradient(var(--grid-line) 1px, transparent 1px 10vmin) 0 -5vmin / 10vmin 10vmin;
      mask: linear-gradient(-15deg, transparent 30%, white);
      top: 0;
      z-index: -1;
    }

    section {
      display: grid;
      gap: 4rem;
      align-items: center;
      justify-content: center;
    }

    .code {
      font-size: 3rem;
      display: flex;
      flex-wrap: nowrap;
      color: var(--text-white);
      border-radius: 1rem;
      background: var(--bg-panel);
      justify-content: center;
      box-shadow: 0 1px rgba(255, 255, 255, 0.25) inset;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .code:hover {
      cursor: grab;
    }

    .digit {
      display: flex;
      height: 100%;
      padding: 5.5rem 1rem;
      outline: none;
    }

    .digit:focus-visible {
      outline: 2px solid rgba(128, 128, 128, 0.25);
      outline-offset: 1rem;
    }

    .digit span {
      display: inline-block;
      scale: calc(var(--active, 0) + 0.5);
      filter: blur(calc((1 - var(--active, 0)) * 1rem));
      transition: scale calc(((1 - var(--active, 0)) + 0.2) * 1s), filter calc(((1 - var(--active, 0)) + 0.2) * 1s);
    }

    .digit:first-of-type {
      padding-left: 5rem;
    }
    
    .digit:last-of-type {
      padding-right: 5rem;
    }

    /* Proximity Logic */
    .digit:is(:hover, :focus-visible) {
      --active: var(--lerp-0);
    }
    
    .digit:is(:hover, :focus-visible) + .digit,
    .digit:has(+ .digit:is(:hover, :focus-visible)) {
      --active: var(--lerp-1);
    }
    
    .digit:is(:hover, :focus-visible) + .digit + .digit,
    .digit:has(+ .digit + .digit:is(:hover, :focus-visible)) {
      --active: var(--lerp-2);
    }
    
    .digit:is(:hover, :focus-visible) + .digit + .digit + .digit,
    .digit:has(+ .digit + .digit + .digit:is(:hover, :focus-visible)) {
      --active: var(--lerp-3);
    }
    
    .digit:is(:hover, :focus-visible) + .digit + .digit + .digit + .digit,
    .digit:has(+ .digit + .digit + .digit + .digit:is(:hover, :focus-visible)) {
      --active: var(--lerp-4);
    }
    
    .digit:is(:hover, :focus-visible) + .digit + .digit + .digit + .digit + .digit,
    .digit:has(+ .digit + .digit + .digit + .digit + .digit:is(:hover, :focus-visible)) {
      --active: var(--lerp-5);
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->
 <section>
  <ul class="code">
    <li tabindex="0" class="digit">
      <span>0</span>
    </li>
    <li tabindex="0" class="digit">
      <span>3</span>
    </li>
    <li tabindex="0" class="digit">
      <span>4</span>
    </li>
    <li tabindex="0" class="digit">
      <span>8</span>
    </li>
    <li tabindex="0" class="digit">
      <span>7</span>
    </li>
    <li tabindex="0" class="digit">
      <span>2</span>
    </li>
  </ul>
</section>
<!-- HTML -->


</body>
</html>
