<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Time Sync</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="TimeZone.css">
</head>

<body class="bg-dark text-light">

<div class="container py-3">
  <h4 class="text-center mb-4">Time Zone Syncer</h4>

  <div class="row g-2">

    <div class="col-6">
      <label>Your Zone</label>
      <select id="tz1" class="form-select"></select>

      <button id="detectBtn" class="btn btn-sm btn-info mt-2 w-100">
        Use My Location
      </button>

      <label class="mt-3">Enter Time (12hr)</label>
      <input type="text" id="timeInput" placeholder="7:30 PM" class="form-control">
    </div>

    <div class="col-6 d-flex flex-column">

    <label>Target Zone</label>
    <select id="tz2" class="form-select"></select>

    <!-- spacer to match left button -->
    <div style="height:38px;"></div>

    <label class="mt-3">Calculated Time</label>
    <input type="text" id="resultTime" class="form-control" readonly>

    </div>

  </div>

  <div>
      <div class="card bg-secondary mt-4 p-3 position-relative"> 
            <i id="copyBtn" class="bi bi-clipboard position-absolute top-0 end-1" style="cursor:pointer;"></i>
            <span style="height: 25px;"></span>
          <div id="preview1"></div>
          <div id="preview2"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>

<script src="TimeZone.js"></script>
</body>
</html>
