<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ganesh: Emoji Navigation Widget</title>

  <style>
    body { background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh;  font-family: system-ui, sans-serif; margin: 0;}
    
    /* css */
    :root {
      --bg-dark: #131313;
      --text-white: #ffffff;
      --nav-max-width: 360px;
      --nav-max-height: 480px;
      --transition-speed: 300ms;
      /* Auto shade calculation: rgba(255,255,255,0.8) */
      --text-soft: color-mix(in srgb, var(--text-white), transparent 20%);
    }

    body {
      background: var(--bg-dark);
      font-size: 12px;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
    }

    a {
      text-decoration: none;
      color: var(--text-white);
      padding: 13px;
      opacity: 0.8;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    a:hover {
      opacity: 1;
    }

    a:before {
      font-family: apple color emoji, segoe ui emoji, notocoloremoji, segoe ui symbol, android emoji, emojisymbols, emojione mozilla;
    }

    .menu-item:first-of-type a { border-radius: 13px 0 0 21px; }
    .menu-item:last-of-type a { border-radius: 0 21px 13px 0; }

    .sub-menu .menu-item:first-of-type a { border-radius: 13px 21px 0 0; }
    .sub-menu .menu-item:last-of-type a { border-radius: 0 0 21px 13px; }

    nav {
      max-width: var(--nav-max-width);
      max-height: var(--nav-max-height);
      display: flex;
      align-items: flex-end;
      animation: bounceIn var(--transition-speed) cubic-bezier(0.175, 0.885, 0.320, 1.275) 1 forwards;
      animation-delay: 500ms;
      transform-style: preserve-3d;
      opacity: 0;
    }

    ol {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      width: 100%;
    }

    .menu-item {
      position: relative;
      display: inline-flex;
      width: 20%;
    }

    .sub-menu {
      display: block;
      opacity: 0;
      pointer-events: none;
      position: absolute;
      bottom: 89px;
      transform: skewY(-5deg) scale(0.89) rotateX(-5deg) rotateZ(-3deg);
      transition: opacity var(--transition-speed);
    }

    .menu-item:hover .sub-menu {
      pointer-events: all;
      animation: showBounce var(--transition-speed) cubic-bezier(0.175, 0.885, 0.320, 1.275) forwards;
      transform-style: preserve-3d;
    }

    .sub-menu li {
      display: flex;
      width: 100%;
    }

    .sub-menu a {
      font-size: 17px;
      width: 100%;
    }

    .menu-item:nth-of-type(3) .sub-menu li:nth-of-type(2) a { font-size: 21px; }
    .menu-item:nth-of-type(3) .sub-menu li:nth-of-type(3) a { font-size: 27px; }

    .menu-item a {
      position: relative;
      text-align: center;
      width: 100%;
    }

    .menu-item a:before {
      content: '';
      display: block;
      font-size: 34px;
      transform: rotateZ(-8deg);
      margin-bottom: 5px;
      transition: transform 189ms ease-out;
    }

    .menu-item a:hover:before {
      animation: hoverEmoji 600ms cubic-bezier(0.175, 0.885, 0.320, 1.275) forwards;
    }

    nav > ol > .menu-item:nth-of-type(1) > a:before { content: '🏠'; }
    nav > ol > .menu-item:nth-of-type(2) > a:before { content: '🤷'; }
    nav > ol > .menu-item:nth-of-type(3) > a:before { content: '🛠️'; }
    nav > ol > .menu-item:nth-of-type(4) > a:before { content: '🍽️'; }
    nav > ol > .menu-item:nth-of-type(5) > a:before { content: '📨'; }

    nav > ol > .menu-item:nth-of-type(3) ol li a:before,
    nav > ol > .menu-item:nth-of-type(4) ol li a:before {
      content: '💪';
      display: inline-flex;
      font-size: inherit;
      transform: rotateZ(-8deg);
      margin-right: 5px;
    }

    nav > ol > .menu-item:nth-of-type(4) ol li:nth-of-type(1) a:before { content: '🍖'; }
    nav > ol > .menu-item:nth-of-type(4) ol li:nth-of-type(2) a:before { content: '♨️'; }
    nav > ol > .menu-item:nth-of-type(4) ol li:nth-of-type(3) a:before { content: '☀️'; }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scaleX(0.55) scaleY(0.89); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes showBounce {
      100% { opacity: 1; transform: translateX(-21px) skewY(-5deg); }
    }

    @keyframes hoverEmoji {
      0% { transform: scaleX(0.89) rotateX(-21deg) rotateZ(-8deg); }
      100% { transform: rotateZ(-8deg); }
    }
    /* css */


  </style>
</head>

<body>

<!-- HTML -->

      </ol>
    </li>
    <li class="menu-item"><a href="#0">Contact</a></li>
  </ol>
</nav>
<!-- HTML -->


</body>
</html>
